<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Blueprint subtle grid -->
  <path d="M 64 128 H 448 M 64 256 H 448 M 64 384 H 448 M 128 64 V 448 M 256 64 V 448 M 384 64 V 448" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.3" />

  <!-- Construction Helmet Motif -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Helmet Dome -->
    <path d="M 120 280 C 120 160, 200 130, 256 130 C 312 130, 392 160, 392 280 Z" fill="url(#amberGrad)" />
    
    <!-- Central Ridge -->
    <path d="M 238 130 C 244 120, 268 120, 274 130 L 274 280 L 238 280 Z" fill="#fef3c7" opacity="0.8" />

    <!-- Headband / Accent strip -->
    <rect x="136" y="272" width="240" height="18" rx="6" fill="#b45309" />

    <!-- Helmet Brim -->
    <path d="M 96 290 C 140 280, 372 280, 416 290 C 430 294, 430 318, 412 322 C 340 336, 172 336, 100 322 C 82 318, 82 294, 96 290 Z" fill="#f59e0b" />
    
    <!-- Small Swedish flag / blueprint badge accent -->
    <rect x="238" y="210" width="36" height="24" rx="4" fill="#0284c7" />
    <path d="M 238 220 H 274 M 250 210 V 234" stroke="#fbbf24" stroke-width="4" />
  </g>

  <!-- ByggTerm Typography Accent -->
  <text x="256" y="415" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="2">BYGGTERM</text>
  <text x="256" y="445" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#fbbf24" letter-spacing="4">SVENSK BYGGTERMINOLOGI</text>
</svg>
